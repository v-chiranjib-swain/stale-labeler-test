name: Labeler 986 reproduction

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Test PR number
        required: true
        type: string
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'feature/labeler-986-repro' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          configuration-path: .github/labeler-986-repro.yml
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}
          sync-labels: false
