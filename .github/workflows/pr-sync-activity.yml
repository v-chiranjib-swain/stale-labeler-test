name: PR synchronize stale-label check
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  unstale:
    if: github.event.pull_request.head.ref == 'stale-push-demo' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove test stale label after branch update
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            core.info('Received pull_request action: ' + context.payload.action);
            core.info('Previous head: ' + context.payload.before);
            core.info('Current head: ' + context.payload.after);
            const {data: labels} = await github.rest.issues.listLabelsOnIssue({owner, repo, issue_number});
            if (!labels.some(label => label.name === 'stale-push-demo')) {
              core.info('Not an isolated test PR; skipping.');
              return;
            }
            if (!labels.some(label => label.name === 'stale-push-demo-stale')) {
              core.info('Test stale label is already absent.');
              return;
            }
            await github.rest.issues.removeLabel({owner, repo, issue_number, name: 'stale-push-demo-stale'});
            core.info('Removed test stale label following synchronization.');
